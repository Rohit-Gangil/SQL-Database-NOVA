[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-pharmacy-ml"
version = "0.2.0"
description = "Demand forecasting and inventory optimisation for a multi-branch pharmacy chain"
readme = "README.md"
requires-python = ">=3.11"

# Pinned to the versions this project was actually built and measured on.
# Unpinned dependencies make reported numbers unreproducible.
dependencies = [
    "numpy==2.3.1",
    "pandas==2.3.0",
    "pyarrow==23.0.1",
    "scipy==1.17.1",
    "scikit-learn==1.9.0",
    "duckdb==1.5.5",
    "lightgbm==4.7.0",
    "statsmodels==0.14.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.1",
    "ruff==0.14.6",
]

[tool.setuptools.packages.find]
include = ["nova*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B905",   # zip(strict=) not required on our supported versions
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that need the full generated dataset (deselect with -m 'not slow')",
]
